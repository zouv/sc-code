[package]
name = "sc-code"
version = "0.4.0"
description = "ScCode - A fast, open-source code editor"
authors = ["ScCode contributors", "Siden Technologies Inc (original portions)"]
license = "MIT"
repository = "https://github.com/zouv/sc-code"
edition = "2021"
rust-version = "1.91.0"

[[bin]]
name = "ScCode"
path = "src/main.rs"

[lib]
name = "sc_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
rfd = "0.16"
sc-code-runtime = { path = "../crates/sc-code-runtime" }
tauri = { version = "2.10.3", features = [
  "protocol-asset",
  "tray-icon",
  "devtools",
] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
notify = { version = "7", features = ["macos_fsevent"] }
portable-pty = "0.8"
walkdir = "2"
ignore = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
hostname = "0.4"
dirs = "5"
reqwest = { version = "0.12", features = [
  "rustls-tls",
  "blocking",
  "gzip",
  "deflate",
  "brotli",
] }

# Compression & encoding
flate2 = "1"
zip = "2"
base64 = "0.22"

# Crypto
sha2 = "0.10"
hmac = "0.12"
dotenvy = "0.15"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = "0.4"

# Path utilities
pathdiff = "0.2"
dunce = "1"
glob = "0.3"
globset = "0.4"

# Search indexing
dashmap = "6"
rayon = "1.10"
regex = "1"
memchr = "2"

# Process & terminal management
which = "6"
crossbeam = "0.8"

# WebSocket for orchestration
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Extension API helpers
arboard = "3"
open = "5"
url = "2"

# WASM extension runtime
wasmtime = { version = "43", default-features = false, features = [
  "runtime",
  "component-model",
  "cranelift",
  "async",
] }
wasmtime-wasi = "43"
toml = "0.8"
anyhow = "1"
sc-code-db = { path = "../crates/sc-code-db" }
sc-code-dap = { path = "../crates/sc-code-dap" }
sc-code-remote = { path = "../crates/sc-code-remote" }
sc-code-settings = { path = "../crates/sc-code-settings" }
sc-code-theme = { path = "../crates/sc-code-theme" }

# ScCode crates
sc-code-git = { path = "../crates/sc-code-git" }
sc-code-workspace = { path = "../crates/sc-code-workspace" }

# Internal crates
sc-code-text = { path = "../crates/sc-code-text" }
sc-code-syntax = { path = "../crates/sc-code-syntax" }
sc-code-tasks = { path = "../crates/sc-code-tasks" }
sc-code-extensions = { path = "../crates/sc-code-extensions" }
sc-code-agent = { path = "../crates/sc-code-agent" }
sc-code-lsp = { path = "../crates/sc-code-lsp" }
sc-code-keymap = { path = "../crates/sc-code-keymap" }
sc-code-extension-api = { path = "../crates/sc-code-extension-api" }
sc-code-update = { path = "../crates/sc-code-update" }
sc-code-profiles = { path = "../crates/sc-code-profiles" }
sc-code-auth = { path = "../crates/sc-code-auth" }
sc-code-textmate = { path = "../crates/sc-code-textmate" }
sc-code-context = { path = "../crates/sc-code-context" }

tree-sitter = "0.24"
tree-sitter-rust = "0.23"
urlencoding = "2.1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

