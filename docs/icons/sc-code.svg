<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">ScCode</title>
  <desc id="sc-desc">SC monogram in a plum-charcoal editor window with lavender accents. 控制台左右贴边，圆角完整保留</desc>
  <!--
    整体等比放大，左右描边几乎贴画布边（各留 ~6 SVG 单位安全边距），上下各留 ~25 单位呼吸空间。
    变换公式 p' = s*p + t（SVG transform 列向量右乘：scale 先应用再 translate）。
    原始描边外沿 bbox: x[51,461] y[67,445] w=410 h=378。
    s=1.22: 水平方向 410*1.22=500.2，两侧各留 (512-500.2)/2≈5.9 单位边距；
            垂直方向 378*1.22=461.2，上下各留 (512-461.2)/2≈25.4 单位边距。
    tx=ty=256*(1-1.22)=-56.32（精确居中）取 -56.3。
    所有元素（圆角、描边、S/C 字母、>_ 提示符）均在 viewBox 内无裁切。
  -->
  <g transform="translate(-56.3 -56.3) scale(1.22)">
    <rect x="60" y="76" width="392" height="360" rx="36" fill="#272132"/>
    <path d="M96 76H416A36 36 0 0 1 452 112V150H60V112A36 36 0 0 1 96 76Z" fill="#675477"/>
    <rect x="60" y="76" width="392" height="360" rx="36" fill="none" stroke="#b59bcf" stroke-width="18"/>
    <path d="M69 150H443" stroke="#b59bcf" stroke-width="14"/>
    <g fill="#f0e5ff"><circle cx="102" cy="113" r="10"/><circle cx="138" cy="113" r="10"/><circle cx="174" cy="113" r="10"/></g>
    <path d="M237 202H177C150 202 136 217 136 239S153 274 178 274H197C223 274 238 289 238 310S222 344 197 344H136"
          fill="none" stroke="#f7f2fc" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M376 214C363 204 350 200 333 200C298 200 276 225 276 272S298 346 333 346C350 346 363 342 376 330"
          fill="none" stroke="#c19aff" stroke-width="28" stroke-linecap="round"/>
    <path d="M148 372L174 391L148 410"
          fill="none" stroke="#e8d9ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M212 402H282" stroke="#c19aff" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
